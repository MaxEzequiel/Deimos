{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1 class="text-center">
        <i class="fas fa-check-circle"></i> ¡Listo!
    </h1>
    
    <div class="info-card text-center">
        <i class="fas fa-check-double" style="font-size: 3rem; color: #2ecc71;"></i>
        <p class="mt-3">
            <i class="fas fa-check"></i> Tu contraseña fue cambiada exitosamente
        </p>
        <p class="small">
            <i class="fas fa-shield-alt"></i> Ahora podés iniciar sesión con tu nueva contraseña
        </p>
    </div>
    
    <div class="button-group">
        <a href="/login/" class="btn-outline-light">
            <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
