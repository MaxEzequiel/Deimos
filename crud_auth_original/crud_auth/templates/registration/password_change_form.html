{% extends "base.html" %}
{% block content %}
	<div class="login-box">
		<h1>Cambiar contraseña</h1>
		<form method="post">
			{% csrf_token %}
			{% include "includes/styled_form_fields.html" with form=form %}
			<button
				type="submit"
				class="btn-outline-light"
			>
				Guardar contraseña
			</button>
		</form>
	</div>
{% endblock %}
