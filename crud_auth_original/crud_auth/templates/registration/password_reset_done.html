{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1 class="text-center">
        <i class="fas fa-check-circle"></i> Correo enviado
    </h1>
    
    <div class="info-card text-center">
        <i class="fas fa-envelope-open-text" style="font-size: 3rem; color: #2ecc71;"></i>
        <p class="mt-3">
            <i class="fas fa-check"></i> Recibiste un enlace en tu correo para poder restablecer tu contraseña
        </p>
        <p class="small">
            <i class="fas fa-clock"></i> Revisá tu bandeja de entrada y también la carpeta de spam
        </p>
    </div>
    
    <div class="button-group">
        <a href="/login/" class="btn-outline-light">
            <i class="fas fa-sign-in-alt"></i> Volver al inicio de sesión
        </a>
    </div>
</div>
{% endblock %}
