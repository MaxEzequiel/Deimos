{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1 class="text-center">
        <i class="fas fa-key"></i> Recuperar mi contraseña
    </h1>
    
    <div class="info-card text-center mb-4">
        <i class="fas fa-envelope" style="font-size: 2rem; color: #f39c12;"></i>
        <p class="mt-2">Ingresá tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_email">
                <i class="fas fa-envelope"></i> Correo electrónico:
            </label>
            {{ form.email }}
        </div>
        
        <button type="submit" class="btn-outline-light">
            <i class="fas fa-paper-plane"></i> Enviar Email
        </button>
    </form>
    
    <div class="button-group" style="margin-top: 1.5rem;">
        <a href="/login/" class="btn-secondary-custom">
            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
