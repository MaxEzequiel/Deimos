{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1 class="text-center">Recuperar mi contraseña</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-outline-light">Enviar Email</button>
    </form>
    
    <div class="button-group" style="margin-top: 1rem;">
        <a href="/login/" class="btn-secondary-custom">Volver al inicio</a>
    </div>
</div>
{% endblock %}
