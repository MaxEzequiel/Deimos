{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Deimos Gym - Iniciar Sesión{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS Personalizado de la app (TODOS los estilos están aquí) -->
    <link rel="stylesheet" href="/static/style/style.css">
    
    <!-- Noty CSS y JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.min.js"></script>
    <link rel="stylesheet" href="{% static 'style/responsive-fix.css' %}">
    
    {% block head %}{% endblock %}
    
    <!-- Estilos mínimos necesarios para centrar el login en la pantalla -->
    <style>
        /* Solo lo necesario para centrar el contenido, sin duplicar estilos */
        .login-page-body {
            background-color: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="login-page-body">
    <div class="login-wrapper">
        <!-- Usamos las clases existentes de style.css -->
        <div class="login-box">
            <h1>
                <i class="fas fa-dumbbell"></i> Deimos Gym
            </h1>
            <p style="text-align: center; color: #888; margin-bottom: 25px;">Iniciar Sesión</p>
            
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/notifications.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
