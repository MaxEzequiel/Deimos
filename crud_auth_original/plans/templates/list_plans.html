{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <h1 class="text-center" style="margin: 0; font-size: 2rem;">
        <i class="fas fa-list"></i> Listado de Planes
    </h1>
    <a href="/plans-pdf" class="btn-primary-custom" style="width: auto; padding: 10px 24px; text-decoration: none;">
        <i class="fas fa-file-pdf"></i> Descargar PDF
    </a>
</div>

<div class="row">
    {% for plan in plans %}
    <div class="col-md-6 mb-4">
        <div class="plan-card">
            <div class="plan-icon">
                <i class="fas fa-dumbbell"></i>
            </div>
            <div class="plan-title">{{ plan.name }}</div>
            <div class="plan-description">{{ plan.description }}</div>
            <div class="plan-price">
                <i class="fas fa-dollar-sign"></i> {{ plan.base_price }}
            </div>
            <div class="plan-actions">
                <a href="{% url 'edit_plan' plan.id %}" class="btn-edit">
                    <i class="fas fa-edit"></i> Editar
                </a>
                <a href="{% url 'delete_plan' plan.id %}" class="btn-delete-plan">
                    <i class="fas fa-trash-alt"></i> Eliminar
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="info-card text-center">
            <i class="fas fa-folder-open" style="font-size: 3rem; color: #f39c12;"></i>
            <p class="mt-3">No hay planes disponibles.</p>
            <a href="{% url 'create_plan' %}" class="btn-create mt-3" style="display: inline-block; text-decoration: none;">
                <i class="fas fa-plus-circle"></i> Crear primer plan
            </a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock content %}
