{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center">Editar Plan</h2>
    
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-edit w-100">Guardar Cambios</button>
        
        {% if error %}
        <div class="alert alert-error mt-3">{{ error }}</div>
        {% endif %}
    </form>
</div>

{% endblock content %}
