{% extends "base.html" %}

{% block content %}

<div class="signup-box" style="max-width: 600px;">
    <h1 class="text-center">
        <i class="fas fa-plus-circle"></i> Crear Nuevo Plan
    </h1>
    
    <form action="" method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="nombre">
                <i class="fas fa-tag"></i> Nombre del plan:
            </label>
            <input type="text" name="nombre" id="nombre" placeholder="Ej: Plan Premium" required>
        </div>
        
        <div class="form-group">
            <label for="descripcion">
                <i class="fas fa-align-left"></i> Descripción:
            </label>
            <textarea name="descripcion" id="descripcion" rows="4" placeholder="Descripción del plan..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="precio">
                <i class="fas fa-dollar-sign"></i> Precio:
            </label>
            <input type="text" name="precio" id="precio" placeholder="$0.00" required>
        </div>
        
        <button type="submit" class="btn-create w-100 mt-3">
            <i class="fas fa-save"></i> Guardar Plan
        </button>
        
        <div class="button-group mt-3">
            <a href="{% url 'list_plans' %}" class="btn-secondary-custom">
                <i class="fas fa-arrow-left"></i> Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock content %}
