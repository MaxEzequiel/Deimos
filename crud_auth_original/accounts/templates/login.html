{% extends "base.html" %}

{% block content %}

<div class="login-box">
    <h1 class="text-center">Iniciar Sesión</h1>
    
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    
    <form action="" method="POST">
        {% csrf_token %}
        {{ login_form.as_p }}
        <button type="submit">Ingresar</button>
    </form>
    <a href="/accounts/password_reset/">¿olvidaste tu clave?</a>
</div>

{% endblock %}
