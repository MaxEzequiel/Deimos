{% extends "base.html" %}

{% block content %}

<div class="login-box">
    <h1 class="text-center">
        <i class="fas fa-trash-alt"></i> Eliminar Cuenta
    </h1>
    
    <div class="info-card text-center mb-4 warning-card">
        <i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i>
        <p class="mt-2">
            <strong>Esta accion desactivara la cuenta</strong>
        </p>
    </div>
    
    {% if error %}
    <div class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}
    
    <form action="" method="post">
        {% csrf_token %}
        
<button type="submit" class="btn-outline-light">
    <i class="fas fa-trash-alt"></i> Desactivar cuenta
</button>
        
        <div class="button-group mt-3">
            <a href="{% url 'list_accounts' %}" class="btn-secondary-custom">
                <i class="fas fa-arrow-left"></i> Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
