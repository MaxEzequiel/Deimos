{% extends "base.html" %}

{% block content %}
<form action="" method="POST">

{% csrf_token %}

Usuario : {{ user.name }}
Nombre : {{ user.person.name }}
Apellido : {{ user.person.surname }}
<select name="group_id" id="">
{% for group in groups %}
<option value="{{ group.id }}" 
    {% if group in user.groups.all %}selected{% endif %}>
    {{ group.name }} 
</option>
{% endfor %}
</select>

<button type="submit">Guardar</button>
</form>
{% endblock %}
