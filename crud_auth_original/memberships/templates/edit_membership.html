{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center">Editar membresía de {{ username }}</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-edit w-100">Guardar Cambios</button>
    </form>
    
    {% if messages %}
        {% for m in messages %}
        <div class="alert alert-info mt-3">{{ m }}</div>
        {% endfor %}
    {% endif %}
</div>

{% endblock %}
