{% extends "base.html" %}

{% block content %}

<h2>Usuarios Registrados</h2>

<div class="row">
    {% for perfil in perfiles %}
    <div class="col-md-6 mb-3">
        <div class="perfil-card">
            <h4>{{ perfil.User.username }}</h4>
            <p>DNI: {{ perfil.dni }}</p>
            {% if perfil.User.email %}
            <p>Email: {{ perfil.User.email }}</p>
            {% endif %}
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">No hay perfiles registrados.</div>
    </div>
    {% endfor %}
</div>

{% endblock content %}
