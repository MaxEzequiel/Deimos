{% extends "base.html" %}

{% block content %}

<div class="container-main">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="profile-card" style="text-align: center; max-width: 500px;">
            <div class="profile-avatar" style="width: 150px; height: 150px; font-size: 4rem; margin-bottom: 1.5rem;">
                <i class="fas fa-lock"></i>
            </div>
            
            <h1 style="color: #f39c12; font-size: 3rem; margin-bottom: 1rem;">403</h1>
            
            <h2 style="color: #e74c3c; font-size: 1.8rem; margin-bottom: 1rem;">Acceso Denegado</h2>
            
            <p style="color: #b0b0b0; font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6;">
                <i class="fas fa-exclamation-circle" style="color: #e74c3c; margin-right: 0.5rem;"></i>
                No cuentas con permisos suficientes
            </p>
            
            <div class="button-group" style="margin-top: 2rem;">
                <a href="{% url 'home' %}" class="btn-primary-custom" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: auto; width: auto; padding: 12px 32px;">
                    <i class="fas fa-arrow-left"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
