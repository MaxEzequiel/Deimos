{% extends "base.html" %}

{% block content %}

<div class="card text-center" style="max-width: 500px; margin: 2rem auto;">
    <h3>¿Deseas eliminar este plan?</h3>
    <p class="mt-3">Esta acción no se puede deshacer.</p>
    
    <form action="" method="POST" class="mt-3">
        {% csrf_token %}
        <div class="d-flex gap-3 justify-content-center">
            <a href="{% url 'listar_planes' %}" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-delete">Eliminar</button>
        </div>
    </form>
</div>

{% endblock content %}
